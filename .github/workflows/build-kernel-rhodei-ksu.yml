name: Build Kernel rhodei + KernelSU

on:
  workflow_dispatch:
    inputs:
      swap_display:
        description: 'Troca techpack/display pelo oficial Motorola 5.4'
        type: boolean
        default: false
  push:
    branches:
      - 13-rebase
    paths:
      - 'arch/arm64/configs/vendor/rhodei_defconfig'
      - 'arch/arm64/configs/rhodec_stock_defconfig'
      - '.github/workflows/build-kernel-rhodei-ksu.yml'

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: github-cloud
  DEFCONFIG: rhodec_stock_defconfig
  KERNEL_REPO: https://github.com/EzequielDevTeam/android_kernel_motorla_rhodei
  KERNEL_BRANCH: ${{ github.ref_name }}
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Instalar dependências do host Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev xz-utils curl git zip unzip ccache \
            python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libxml2-utils rsync

      - name: 2. Clonar kernel com submódulo KernelSU (--recursive)
        run: |
          # Requisito: baixar o KernelSU junto (está como submódulo em path=KernelSU)
          # .gitmodules do repositório:
          #   [submodule "KernelSU"]
          #     path = KernelSU
          #     url = https://github.com/tiann/KernelSU
          git clone --recursive --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel-source
          cd kernel-source
          git submodule update --init --recursive
          ls -la
          ls -la KernelSU || (echo "ERRO: submódulo KernelSU não veio!" && exit 1)

      - name: 2b. Trocar techpack/display pelo snapshot oficial Motorola 5.4
        if: ${{ inputs.swap_display == true }}
        working-directory: kernel-source
        run: |
          git clone --depth=1 -b MMI-T1SSS33.1-119-8-16 https://github.com/MotorolaMobilityLLC/kernel-msm-5.4-techpack-display.git /tmp/td
          rm -rf techpack/display
          cp -r /tmp/td techpack/display
          rm -rf techpack/display/.git
          ls techpack/display/msm/dsi/ | head -n 5

      - name: 3. Setup KernelSU v3.3.0 + backport para kernel 5.4
        working-directory: kernel-source
        run: |
          # Pedido do usuário: v3.3.0 mesmo no kernel 5.4 (experimental, pode dar erros).
          # v3.x foi feita para 5.9+/GKI, então aplicamos backports mínimos.
          if [ -f KernelSU/kernel/setup.sh ]; then
            bash KernelSU/kernel/setup.sh v3.3.0 || echo "setup.sh avisou algo, continuando..."
            echo "KSU em:"
            git -C KernelSU describe --tags || git -C KernelSU rev-parse --short HEAD
          else
            echo "KernelSU/kernel/setup.sh não encontrado"
            ls -R KernelSU | head -n 100
          fi
          echo "=== Backport 5.4: linux/pgtable.h -> asm/pgtable.h ==="
          # Em 5.4 não existe include/linux/pgtable.h (só a partir do 5.9).
          # O v3.3.0 usa em kernel/feature/sucompat.c: #include <linux/pgtable.h>
          grep -rn "linux/pgtable.h" KernelSU/ drivers/kernelsu/ 2>/dev/null | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' || true
          if [ -L drivers/kernelsu ]; then
            echo "drivers/kernelsu é symlink, arquivos reais já patchados via KernelSU/"
          else
            find drivers/kernelsu \( -name '*.c' -o -name '*.h' \) 2>/dev/null | xargs sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#g' || true
          fi
          echo "=== Verificação ==="
          grep -rn "pgtable.h" KernelSU/kernel/feature/sucompat.c || true
          echo "=== Backport 5.4: strncpy_from_user_nofault -> strncpy_from_user ==="
          # strncpy_from_user_nofault só existe no 5.9+. No 5.4 usamos strncpy_from_user.
          # Erro visto: sucompat.c:104:5: error: implicit declaration of function 'strncpy_from_user_nofault'
          grep -rn "strncpy_from_user_nofault" KernelSU/ 2>/dev/null | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#strncpy_from_user_nofault#strncpy_from_user#g' || true
          grep -rn "strncpy_from_user" KernelSU/kernel/feature/sucompat.c | head || true
          echo "=== Backport 5.4: register_trace_prio_sys_enter -> register_trace_sys_enter ==="
          # register_trace_prio_* só existe no 5.10+. No 5.4 usamos register_trace_sys_enter.
          # Erro visto: syscall_hook_manager.c:142:11: error: implicit declaration of function 'register_trace_prio_sys_enter'
          grep -rn "register_trace_prio_" KernelSU/ 2>/dev/null | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)#register_trace_sys_enter(ksu_sys_enter_handler, NULL)#g' || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#register_trace_prio_#register_trace_#g; s#, NULL, INT_MIN)#, NULL)#g' || true
          grep -rn "register_trace.*sys_enter" KernelSU/kernel/hook/syscall_hook_manager.c | head || true
          echo "=== Backport 5.4: patch_memory __p4d_to_phys + copy_to_kernel_nofault ==="
          # Erros vistos:
          #   patch_memory.c:46:16: error: implicit declaration of function '__p4d_to_phys'
          #   patch_memory.c:150:16: error: implicit declaration of function 'copy_to_kernel_nofault'
          # No 5.4 arm64 não há P4D real (__p4d_to_phys não existe) nem copy_to_kernel_nofault (só 5.8+).
          # copy_to_kernel_nofault(dst,src,len)=0 ok / -EFAULT erro == probe_kernel_write(dst,src,len).
          PM=KernelSU/kernel/hook/arm64/patch_memory.c
          grep -n "__p4d_to_phys\|copy_to_kernel_nofault" "$PM" | head || true
          # 1) shim para __p4d_to_phys (P4D huge page não existe no 5.4, bloco nunca executa de verdade)
          grep -q "__p4d_to_phys compat" "$PM" || python3 - "$PM" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          anchor = '#include "asm-generic/fixmap.h"'
          shim = anchor + '\n\n// Compat 5.4: sem P4D real nem __p4d_to_phys (só 5.9+). P4D huge page inexistente no arm64 5.4.\n#ifndef __p4d_to_phys\n#define __p4d_to_phys(x) (0) /* __p4d_to_phys compat 5.4 */\n#endif'
          if '__p4d_to_phys compat' not in s:
              s = s.replace(anchor, shim, 1)
              open(p, 'w').write(s)
              print('shim __p4d_to_phys aplicado')
          else:
              print('shim já existia')
          PYEOF
          # 2) copy_to_kernel_nofault -> probe_kernel_write (mesma semântica 0/-EFAULT no 5.4)
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#copy_to_kernel_nofault#probe_kernel_write#g' || true
          grep -n "probe_kernel_write\|__p4d_to_phys" "$PM" | head || true
          echo "=== Backport 5.4: SECCOMP_ARCH_NATIVE_NR fallback ==="
          # Erro visto: seccomp_cache.c:12:34: error: use of undeclared identifier 'SECCOMP_ARCH_NATIVE_NR'
          # Macro só existe no 5.13+. No 5.4 definimos fallback 512 (cobre todos os syscalls arm64 ~450).
          SC=KernelSU/kernel/infra/seccomp_cache.c
          grep -n "SECCOMP_ARCH" "$SC" | head || true
          grep -q "SECCOMP_ARCH_NATIVE_NR compat 5.4" "$SC" || python3 - "$SC" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          anchor = '#include "infra/seccomp_cache.h"'
          shim = anchor + '\n\n// Compat 5.4: SECCOMP_ARCH_*_NR só existe no 5.13+. Fallback cobre syscalls arm64.\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 512 /* SECCOMP_ARCH_NATIVE_NR compat 5.4 */\n#endif\n#ifndef SECCOMP_ARCH_COMPAT_NR\n#define SECCOMP_ARCH_COMPAT_NR 512\n#endif'
          if 'SECCOMP_ARCH_NATIVE_NR compat 5.4' not in s:
              s = s.replace(anchor, shim, 1)
              open(p, 'w').write(s)
              print('shim SECCOMP_ARCH_NATIVE_NR aplicado')
          else:
              print('shim já existia')
          PYEOF
          grep -n "SECCOMP_ARCH" "$SC" | head || true
          echo "=== Backport 5.4: fsnotify handle_inode_event -> handle_event ==="
          # Erro visto: pkg_observer.c:39:6: error: field designator 'handle_inode_event' does not refer
          # .handle_inode_event só existe no 5.19+. No 5.4 struct fsnotify_ops só tem .handle_event
          # com assinatura antiga (group,inode,mask,data,data_type,file_name,cookie,iter_info).
          PO=KernelSU/kernel/manager/pkg_observer.c
          grep -n "handle_inode_event\|handle_event" "$PO" | head || true
          grep -q "ksu_handle_event_54" "$PO" || (echo '' | base64 -d | python3 - "$PO")
          grep -n "handle_inode_event\|handle_event\|ksu_handle_event_54" "$PO" | head || true
          echo "=== Backport 5.4: task_work_add TWA_RESUME + put_task_struct ==="
          # Erros vistos em allowlist.c:
          #   error: use of undeclared identifier 'TWA_RESUME' (flags só 5.10+, no 5.4 3o arg é bool)
          #   error: implicit declaration of function 'put_task_struct' (falta include no 5.4)
          # TWA_RESUME vale 1 == true, troca segura em qualquer versão.
          AL=KernelSU/kernel/policy/allowlist.c
          grep -n "TWA_RESUME\|put_task_struct\|linux/sched.h" "$AL" | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#task_work_add(tsk, cb, TWA_RESUME)#task_work_add(tsk, cb, true)#g; s#TWA_RESUME#true#g' || true
          grep -q "linux/sched/task.h" "$AL" || sed -i 's|#include <linux/rcupdate.h>|#include <linux/sched/task.h>\n#include <linux/rcupdate.h>|' "$AL" || true
          grep -n "TWA_RESUME\|task_work_add(tsk\|sched" "$AL" | head || true
          echo "=== Backport 5.4: seccomp filter_count nao existe ==="
          # Erro visto: app_profile.c:104:34: error: no member named 'filter_count' in 'struct seccomp'
          # filter_count só existe no 5.13+. No 5.4 mode=0 + filter=NULL já desliga o seccomp.
          AP=KernelSU/kernel/policy/app_profile.c
          grep -n "filter_count" "$AP" | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#atomic_set(&current->seccomp.filter_count, 0);#// compat 5.4: struct seccomp sem filter_count (so 5.13+)#g' || true
          grep -n "filter_count" "$AP" | head || true
          echo "=== Backport 5.4: copy_from/to_user_nofault -> copy_from/to_user ==="
          # Erro visto: ksud_integration.c:597/600: implicit declaration (só 5.8+).
          # No contexto (hook de syscall, pode dormir) o plain tem mesma semântica: retorna bytes NAO copiados.
          grep -rn "copy_from_user_nofault\|copy_to_user_nofault" KernelSU/ 2>/dev/null | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#copy_from_user_nofault#copy_from_user#g; s#copy_to_user_nofault#copy_to_user#g' || true
          grep -rn "user_nofault" KernelSU/ 2>/dev/null | head || echo "sem mais _nofault"
          echo "=== Backport 5.4: add_filename_trans da v0.9.5 (filename_trans antigo) ==="
          # Erros vistos: sepolicy.c:569+ filename_trans_key/filenametr_search/stypes/next/compat_count (so 5.9+).
          # No 5.4 o filename_trans usa struct filename_trans + hashtab de 3 args. Transplanta funcao da v0.9.5.
          echo "" | base64 -d > /tmp/addft_patch.py
          python3 /tmp/addft_patch.py KernelSU/kernel/selinux/sepolicy.c
          echo "=== Backport 5.4: selinux_hide status/ss + helpers ==="
          # Erros vistos: selinux_hide.c status_lock/status_page/policy em selinux_state (no 5.4 ficam em .ss).
          echo "" | base64 -d > /tmp/shide54_patch.py
          python3 /tmp/shide54_patch.py KernelSU/kernel/feature/selinux_hide.c
          echo "=== Backport 5.4: remove hooks antigos + mount/seccomp por ksys ==="
          # Kernel tem hooks do KSU antigo (fs/open,stat,exec,read_write,input) que a v3.3.0 nao fornece.
          # E path_mount/umount + seccomp_filter_release nao existem no 5.4. Resolve tudo aqui.
          echo "" | base64 -d > /tmp/link54_patch.py
          python3 /tmp/link54_patch.py .
          echo "=== Backport 5.4: linux/minmax.h -> linux/kernel.h ==="
          # Erro visto: sulog/event.c:5:10: fatal error: 'linux/minmax.h' file not found (só 5.19+).
          # No 5.4 min()/max() moram em linux/kernel.h.
          grep -rn "linux/minmax.h" KernelSU/ 2>/dev/null | head || true
          find KernelSU \( -name '*.c' -o -name '*.h' \) | xargs sed -i 's#<linux/minmax.h>#<linux/kernel.h>#g' || true
          grep -rn "minmax.h\|kernel.h" KernelSU/kernel/sulog/event.c | head || true
          echo "=== Backport 5.4: sched.h no supercall/dispatch.c ==="
          # Erro visto: dispatch.c:642: tasklist_lock/task_pgrp/init_task/task_session nao declarados.
          # No 5.4 ficam em linux/sched.h, que o arquivo nao inclui (nas novas vem por tabela).
          SD=KernelSU/kernel/supercall/dispatch.c
          grep -n "include.*sched.h\|tasklist_lock" "$SD" | head || true
          grep -q "linux/sched/task.h" "$SD" || sed -i 's|#include <linux/capability.h>|#include <linux/sched/task.h>\n#include <linux/sched/signal.h>\n#include <linux/capability.h>|' "$SD" || true
          grep -n "linux/sched" "$SD" | head || true
          echo "=== Backport 5.4: selinux dup/swap -> policydb ao vivo (v0.9.5 style) ==="
          # Erros vistos: rules.c:47/54/61/... selinux_state.policy, policy_mutex, selinux_policy incompleto.
          # selinux_state.policy/policy_mutex/dup atomico so existem no 5.10+. No 5.4 edita ao vivo via selinux_state.ss.
          echo "" | base64 -d > /tmp/selinux54_patch.py
          python3 /tmp/selinux54_patch.py KernelSU/kernel/selinux/rules.c KernelSU/kernel/selinux/sepolicy.c

      - name: 4. Injetar CONFIG_KSU=y e CONFIG_KSU_DEBUG=n no defconfig
        working-directory: kernel-source
        run: |
          # Stock rhodec (extraido do aparelho rodando 5.4.284) = config exata, inclui RHODEC_DTB + NT36XXX.
          # Eh o alvo do build; os outros sao ajustados por compatibilidade.
          for f in arch/arm64/configs/rhodec_stock_defconfig arch/arm64/configs/rhodei_stock_defconfig arch/arm64/configs/vendor/rhodei_defconfig arch/arm64/configs/rhodei_defconfig; do
            if [ -f "$f" ]; then
              echo ">>> Ajustando $f"
              grep -qxF 'CONFIG_KSU=y' "$f" || echo 'CONFIG_KSU=y' >> "$f"
              # remove qualquer valor antigo de DEBUG e força =n
              sed -i '/CONFIG_KSU_DEBUG/d' "$f"
              echo 'CONFIG_KSU_DEBUG=n' >> "$f"
              # Garantias extras para Snapdragon 480+ (holi) + KernelSU:
              grep -qxF 'CONFIG_KPROBES=y' "$f" || echo 'CONFIG_KPROBES=y' >> "$f"
              grep -qxF 'CONFIG_HAVE_KPROBES=y' "$f" || echo 'CONFIG_HAVE_KPROBES=y' >> "$f"
              grep -qxF 'CONFIG_KPROBE_EVENTS=y' "$f" || echo 'CONFIG_KPROBE_EVENTS=y' >> "$f"
              grep -qxF 'CONFIG_OVERLAY_FS=y' "$f" || echo 'CONFIG_OVERLAY_FS=y' >> "$f"
              echo "--- tail $f ---"
              tail -n 20 "$f"
              grep -E 'KSU|KPROBES|OVERLAY' "$f" || true
            fi
          done
          test -f arch/arm64/configs/rhodec_stock_defconfig || test -f arch/arm64/configs/rhodei_stock_defconfig
          echo "=== Versao 5.4.284 + LOCALVERSION stock (carregar .ko prebuilt) ==="
          # Modulos vendor (touch ili/nova/chipone, backlight, wlan...) sao prebuilt 5.4.284-moto.
          # vermagic tem que bater EXATO senao recusam. Forja SUBLEVEL + LOCALVERSION do stock.
          grep -n "^SUBLEVEL" Makefile
          sed -i 's/^SUBLEVEL = 251/SUBLEVEL = 284/' Makefile
          grep -n "^SUBLEVEL" Makefile
          for f in arch/arm64/configs/rhodec_stock_defconfig arch/arm64/configs/rhodei_stock_defconfig arch/arm64/configs/vendor/rhodei_defconfig arch/arm64/configs/rhodei_defconfig; do
            if [ -f "$f" ]; then
              sed -i '/CONFIG_LOCALVERSION_AUTO/d; s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-moto-g2e2d53e9d950"/' "$f"
              grep -qxF '# CONFIG_LOCALVERSION_AUTO is not set' "$f" || echo '# CONFIG_LOCALVERSION_AUTO is not set' >> "$f"
            fi
          done
          grep -n "LOCALVERSION" arch/arm64/configs/rhodec_stock_defconfig | head

      - name: 5. Baixar toolchain Clang AOSP + GCC cruzado (arm64)
        run: |
          mkdir -p toolchains
          cd toolchains
          # Proton-Clang 13 (base AOSP, padrão de mercado para SD480+ / kernel 5.4)
          # Alternativa Google pura: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          ./clang/bin/clang --version || $PWD/clang/bin/clang --version
          # GCC aarch64/arm32 para CROSS_COMPILE (link + dtb + compat 32-bit)
          # Já instalados via apt, só checando:
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: 5b. Cache do ccache (não recompila as ~4000 coisas toda vez)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-rhodei-54-${{ github.sha }}
          restore-keys: |
            ccache-rhodei-54-

      - name: 6. Configurar ambiente cross-compile arm64
        working-directory: kernel-source
        run: |
          echo "ARCH=${{ env.ARCH }}" >> $GITHUB_ENV
          echo "SUBARCH=${{ env.SUBARCH }}" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH
          # ccache: reaproveita objetos entre runs (só o que mudou recompila)
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros" >> $GITHUB_ENV
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE
          ccache -s || true
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          clang --version
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ARCH=arm64 ${{ env.DEFCONFIG }}
          # Evita build interativo travando no CI (Restart config... / Error in reading or end of file)
          # Responde tudo com default:
          make O=${{ env.OUT_DIR }} ARCH=arm64 olddefconfig
          # Confirma que o .config gerado tem KSU
          grep -E 'CONFIG_KSU' ${{ env.OUT_DIR }}/.config || (echo "KSU não entrou no .config!" && exit 1)

      - name: 7. Compilar kernel com Clang (Snapdragon 480+)
        working-directory: kernel-source
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export CCACHE_DIR=$HOME/.ccache
          export CCACHE_MAXSIZE=2G
          export CCACHE_BASEDIR=$GITHUB_WORKSPACE
          # Build completo. LLVM=1 usa clang/lld/llvm-* integrados.
          # CC="ccache clang": reaproveita os ~4000 .o do cache, recompila só o que mudou.
          # NOTA rhodei: esta arvore nao tem arch/arm64/boot/dts/ -> alvo Image.gz-dtb NAO existe.
          # O correto aqui e Image.gz (o Image puro sai como pre-requisito).
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            LOCALVERSION= \
            Image.gz modules 2>&1 | tee build.log
          ccache -s || true
          echo "=== RESULTADO ==="
          ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/ || true
          ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/dts/qcom/ 2>/dev/null | head || true

      - name: 8. Verificar artefato final
        working-directory: kernel-source
        run: |
          ls -R ${{ env.OUT_DIR }}/arch/arm64/boot/ || true
          # Caminho final esperado (padrão QCOM/MSM):
          #   out/arch/arm64/boot/Image.gz-dtb  (preferencial p/ flash via boot.img)
          #   fallback: out/arch/arm64/boot/Image.gz ou out/arch/arm64/boot/Image
          if [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "OK: Image.gz-dtb gerado"
          elif [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz" ]; then
            echo "AVISO: só Image.gz, sem dtb embutido"
          elif [ -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image" ]; then
            echo "AVISO: só Image puro"
          else
            echo "FALHA: nenhum Image encontrado!"
            exit 1
          fi

      - name: 9. Upload do kernel compilado
        uses: actions/upload-artifact@v4
        with:
          name: rhodei-kernel-ksu-${{ github.run_number }}
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz-dtb
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/.config
            kernel-source/build.log
            kernel-source/out/**/*.ko
          if-no-files-found: error
          retention-days: 14
